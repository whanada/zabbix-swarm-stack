<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="100%" height="100%" fill="#f4f7fb"/>
<text x="55" y="60" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" fill="#12253f">Swarm services and data flow</text>
<text x="55" y="91" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#52657d">Encrypted overlays • labels pin persistent services to workers • no Prometheus server</text>
<rect x="55" y="135" width="300" height="75" rx="12" fill="#eef5ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="72" y="162" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Client / NLB</text>
<text x="72" y="187" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">HTTPS :443 • TCP :10051</text>
<rect x="490" y="135" width="300" height="75" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="507" y="162" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Traefik ×2 on managers</text>
<text x="507" y="187" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">web / websecure • SNI + TCP routes</text>
<polyline points="355,172 490,172" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="45" y="250" width="1410" height="640" rx="16" fill="#dce9f8" fill-opacity="0.45" stroke="#b7cbe1" stroke-width="1.2"/>
<text x="61" y="276" font-family="DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#385675">Docker Swarm encrypted backend overlay</text>
<rect x="75" y="300" width="350" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Zabbix application</text>
<text x="92" y="352" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Frontend ×2 • web service • Selenium</text>
<text x="92" y="374" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">HA servers ×3: :10051 / :10052 / :10053</text>
<text x="92" y="396" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Only the active HA server listens</text>
<rect x="555" y="300" width="325" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="572" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Proxy 001 on worker 3</text>
<text x="572" y="352" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">SQLite volume • TLS to HA servers</text>
<text x="572" y="374" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Optional OTLP / APM collector :4317</text>
<text x="572" y="396" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Telemetry provider uses ClickHouse</text>
<rect x="1030" y="300" width="350" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1047" y="327" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Exporters / native metrics</text>
<text x="1047" y="352" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">PostgreSQL • PgBouncer • pgSCV</text>
<text x="1047" y="374" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">etcd • Patroni • ClickHouse</text>
<text x="1047" y="396" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">node • process • cAdvisor</text>
<polyline points="550,210 300,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="425,353 555,353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="445" y="340" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#52657d">active server</text>
<rect x="75" y="495" width="310" height="110" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="92" y="522" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">PgBouncer ×2 + router ×2</text>
<text x="92" y="547" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Session pools • separate metrics</text>
<text x="92" y="569" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">HAProxy routes connections</text>
<rect x="465" y="495" width="330" height="110" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="482" y="522" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Database HAProxy ×2</text>
<text x="482" y="547" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Routes writes to Patroni primary</text>
<text x="482" y="569" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Checks Patroni REST endpoints</text>
<rect x="875" y="490" width="505" height="120" rx="12" fill="#eef5ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="892" y="517" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">Patroni / PostgreSQL / TimescaleDB ×3</text>
<text x="892" y="542" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">One primary, two physical replicas</text>
<text x="892" y="564" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">One node and one EBS volume per worker</text>
<text x="892" y="586" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">etcd ×3 maintains cluster consensus</text>
<polyline points="245,410 230,495" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="385,550 465,550" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="795,550 875,550" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="555" y="690" width="370" height="115" rx="12" fill="#fff8e8" stroke="#eccd87" stroke-width="1.5"/>
<text x="572" y="717" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">ClickHouse Keeper ×3</text>
<text x="572" y="742" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Raft coordination • dedicated EBS</text>
<text x="572" y="764" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">One member on each worker</text>
<rect x="1010" y="690" width="370" height="115" rx="12" fill="#fff8e8" stroke="#eccd87" stroke-width="1.5"/>
<text x="1027" y="717" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#152942">ClickHouse ×3 + HTTP router ×2</text>
<text x="1027" y="742" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Replicated telemetry tables</text>
<text x="1027" y="764" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#415571">Dedicated EBS on each worker</text>
<polyline points="925,750 1010,750" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="935" y="737" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#52657d">coordination</text>
<polyline points="740,410 740,450 840,450 840,650 1200,650 1200,690" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="840" y="440" font-family="DejaVu Sans,sans-serif" font-size="13" font-weight="400" fill="#52657d">APM / OTLP storage</text>
<text x="65" y="940" font-family="DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#52657d">TLS certificates and credentials are delivered as Swarm secrets; APM and failover still require end-to-end validation.</text>
</svg>
