---
# Export these values from .env before invoking Ansible.
etcd_image: "{{ lookup('env', 'ETCD_IMAGE') }}"
patroni_image: "{{ lookup('env', 'PATRONI_IMAGE') }}"
haproxy_image: "{{ lookup('env', 'HAPROXY_IMAGE') }}"
pgbouncer_image: "{{ lookup('env', 'PGBOUNCER_IMAGE') }}"
clickhouse_server_image: "{{ lookup('env', 'CLICKHOUSE_SERVER_IMAGE') }}"
clickhouse_keeper_image: "{{ lookup('env', 'CLICKHOUSE_KEEPER_IMAGE') }}"
zabbix_server_image: "{{ lookup('env', 'ZABBIX_SERVER_IMAGE') }}"
zabbix_web_image: "{{ lookup('env', 'ZABBIX_WEB_IMAGE') }}"
zabbix_webservice_image: "{{ lookup('env', 'ZABBIX_WEBSERVICE_IMAGE') }}"
zabbix_proxy_image: "{{ lookup('env', 'ZABBIX_PROXY_IMAGE') }}"
selenium_image: "{{ lookup('env', 'SELENIUM_IMAGE') }}"
traefik_image: "{{ lookup('env', 'TRAEFIK_IMAGE') }}"
