---
- name: Create or recover secrets and certificates in AWS
  hosts: localhost
  no_log: "{{ lookup('env', 'ZABBIX_ANSIBLE_NO_LOG') | default('true', true) | bool }}"
  connection: local
  gather_facts: false
  tasks:
    - name: Require a frontend hostname for the private certificate
      ansible.builtin.assert:
        that: lookup('env', 'ZABBIX_FRONTEND_HOST') | length > 0
        fail_msg: Set ZABBIX_FRONTEND_HOST before provisioning secrets.
    - name: Create or recover project secrets without printing values
      ansible.builtin.command:
        argv: ["{{ ansible_playbook_python }}", "{{ playbook_dir }}/../../scripts/bootstrap-aws-secrets.py"]
      no_log: true
      when: not ansible_check_mode
