global
  maxconn 256
defaults
  mode http
  timeout connect 5s
  timeout client 30m
  timeout server 30m
listen clickhouse
  bind *:8123
  option httpchk GET /ping
  http-check expect status 200
  default-server inter 3s fall 2 rise 2
  server clickhouse1 clickhouse1:8123 check
  server clickhouse2 clickhouse2:8123 check
  server clickhouse3 clickhouse3:8123 check
