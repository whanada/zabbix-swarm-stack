global
  log stdout format raw local0
defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h
  log global
frontend pgbouncer
  bind :5432
  default_backend pools
backend pools
  balance roundrobin
  server pool1 pgbouncer1:5432 check resolvers docker init-addr libc,none
  server pool2 pgbouncer2:5432 check resolvers docker init-addr libc,none
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s
