extensions:
  file_storage/logs:
    directory: /var/lib/otelcol/logs
    create_directory: true
  docker_observer:
    endpoint: unix:///var/run/docker.sock
    timeout: 5s
    cache_sync_interval: 1m
    include_all_containers: true
receivers:
  journald/hosts:
    root_path: /host
    journalctl_path: /usr/bin/journalctl
    directory: /var/log/journal
    start_at: end
    priority: debug
    storage: file_storage/logs
    convert_to_semantic_conventions: true
    retry_on_failure:
      enabled: true
  file_log/audit:
    include: [/host/var/log/audit/audit.log]
    start_at: end
    storage: file_storage/logs
    retry_on_failure:
      enabled: true
    operators:
    - type: regex_parser
      regex: '^type=(?P<audit_type>\S+)\s+msg=audit\((?P<audit_time>\d+\.\d+):\d+\):'
      on_error: send_quiet
      timestamp:
        parse_from: attributes.audit_time
        layout_type: epoch
        layout: s.ms
  receiver_creator/docker-logs:
    watch_observers:
    - docker_observer
    receivers:
      file_log/per-container:
        rule: type == "container" && port == 0 && (!("com.docker.swarm.service.name" in labels) || labels["com.docker.swarm.service.name"]
          != "zabbix_metrics_otel-logs")
        resource_attributes:
          container.id: '`container_id`'
          container.name: '`name`'
          container.image.name: '`image`'
          service.name: '`"com.docker.stack.namespace" in labels && "com.docker.swarm.service.name" in labels ? labels["com.docker.stack.namespace"] + "/" + labels["com.docker.swarm.service.name"] : name`'
          swarm.stack.name: '`"com.docker.stack.namespace" in labels ? labels["com.docker.stack.namespace"] : "standalone"`'
          swarm.service.name: '`"com.docker.swarm.service.name" in labels ? labels["com.docker.swarm.service.name"] : name`'
          swarm.task.name: '`"com.docker.swarm.task.name" in labels ? labels["com.docker.swarm.task.name"] : name`'
        config:
          include:
          - /var/lib/docker/containers/`container_id`/`container_id`-json.log
          start_at: end
          storage: file_storage/logs
          retry_on_failure:
            enabled: true
          operators:
          - type: container
            format: docker
            add_metadata_from_filepath: false
          - type: regex_parser
            id: structured-severity
            regex: '(?i)(?:^|[\s,{])["'']?(?:level|severity|log_level)["'']?\s*[:=]\s*["'']?(?P<level>trace|debug|info|warning|warn|error|critical|crit|fatal|panic)\b'
            on_error: send_quiet
            severity:
              parse_from: attributes.level
          - type: regex_parser
            id: console-severity
            regex: '(?i)^(?:\S+\s+)?\[?(?P<console_level>trace|debug|info|warning|warn|error|critical|crit|fatal|panic)\]?(?:\s|:|$)'
            on_error: send_quiet
            severity:
              parse_from: attributes.console_level
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 175
    spike_limit_mib: 40
  resource/node:
    attributes:
    - key: host.name
      value: ${env:SWARM_NODE_NAME}
      action: upsert
  resource/journal:
    attributes:
    - {key: service.name, value: hosts-swarm, action: upsert}
    - {key: host.name, value: '${env:SWARM_NODE_NAME}', action: upsert}
    - {key: job, value: journal, action: upsert}
  resource/auditd:
    attributes:
    - {key: service.name, value: hosts-swarm, action: upsert}
    - {key: host.name, value: '${env:SWARM_NODE_NAME}', action: upsert}
    - {key: job, value: auditd, action: upsert}
  batch:
    send_batch_size: 512
    timeout: 5s
exporters:
  otlp/zabbix:
    endpoint: zabbix_app_proxy001:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 256
    retry_on_failure:
      enabled: true
      max_elapsed_time: 300s
service:
  extensions:
  - file_storage/logs
  - docker_observer
  pipelines:
    logs/journal:
      receivers: [journald/hosts]
      processors: [memory_limiter, resource/journal, batch]
      exporters: [otlp/zabbix]
    logs/auditd:
      receivers: [file_log/audit]
      processors: [memory_limiter, resource/auditd, batch]
      exporters: [otlp/zabbix]
    logs:
      receivers:
      - receiver_creator/docker-logs
      processors:
      - memory_limiter
      - resource/node
      - batch
      exporters:
      - otlp/zabbix
