---
- name: Prepare AWS and Swarm secrets
  hosts: swarm_manager_primary
  no_log: "{{ lookup('env', 'ZABBIX_ANSIBLE_NO_LOG') | default('true', true) | bool }}"
  gather_facts: false
  become: true
  vars:
    secret_prefix: "{{ lookup('env', 'ZABBIX_SECRET_PREFIX') | default('zabbix-ha', true) }}"
    swarm_secrets:
      - patroni_superuser_password
      - patroni_replication_password
      - zabbix_db_user
      - zabbix_db_password
      - clickhouse_zabbix_password
      - metrics_pg_password
      - metrics_pgbouncer_password
      - zabbix_ca
      - zabbix_server_cert
      - zabbix_server_key
      - zabbix_proxy_cert
      - zabbix_proxy_key
      - traefik_tls_cert
      - traefik_tls_key
  tasks:
    - name: Inspect Swarm secrets
      ansible.builtin.command:
        argv: [docker, secret, inspect, "{{ item }}"]
      loop: "{{ swarm_secrets }}"
      register: swarm_secret_inspections
      changed_when: false
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Copy missing secrets into Swarm
      ansible.builtin.command:
        argv: [docker, secret, create, "{{ item.item }}", '-']
        stdin: "{{ lookup('amazon.aws.secretsmanager_secret', secret_prefix + '/' + item.item, region='us-east-1') }}"
        stdin_add_newline: false
      loop: "{{ swarm_secret_inspections.results | default([]) }}"
      no_log: true
      when: not ansible_check_mode and item.rc != 0
