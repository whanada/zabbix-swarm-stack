---
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  tag:Project: zabbix-ha
  instance-state-name: running
hostnames:
  - instance-id
compose:
  ansible_host: instance_id
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_instance_id: instance_id
  ansible_aws_ssm_region: "'us-east-1'"
  ansible_aws_ssm_bucket_name: "lookup('env', 'ANSIBLE_SSM_BUCKET')"
  swarm_private_ip: private_ip_address
  swarm_node_name: tags.Name
groups:
  swarm_nodes: "tags.SwarmRole in ['manager', 'worker']"
  swarm_manager_primary: "tags.SwarmRole == 'manager' and tags.NodeIndex == '1'"
  swarm_manager_secondary: "tags.SwarmRole == 'manager' and tags.NodeIndex != '1'"
  swarm_workers: "tags.SwarmRole == 'worker'"
