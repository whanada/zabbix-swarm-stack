# Include these scrape_configs in a Prometheus server attached to the encrypted
# zabbix_backend overlay. Each target is independent to expose replica health.
scrape_configs:
  - job_name: postgresql
    static_configs:
      - targets: ['zabbix_metrics_postgres-exporter1:9187', 'zabbix_metrics_postgres-exporter2:9187', 'zabbix_metrics_postgres-exporter3:9187']
  - job_name: timescaledb_pgscv
    static_configs:
      - targets: ['zabbix_metrics_pgscv1:9890', 'zabbix_metrics_pgscv2:9890', 'zabbix_metrics_pgscv3:9890']
  - job_name: pgbouncer
    static_configs:
      - targets: ['zabbix_metrics_pgbouncer-exporter1:9127', 'zabbix_metrics_pgbouncer-exporter2:9127']
  - job_name: patroni
    static_configs:
      - targets: ['zabbix_data_db1:8008', 'zabbix_data_db2:8008', 'zabbix_data_db3:8008']
  - job_name: etcd
    static_configs:
      - targets: ['zabbix_data_etcd1:2379', 'zabbix_data_etcd2:2379', 'zabbix_data_etcd3:2379']
  - job_name: clickhouse
    static_configs:
      - targets: ['zabbix_clickhouse_clickhouse1:9363', 'zabbix_clickhouse_clickhouse2:9363', 'zabbix_clickhouse_clickhouse3:9363']
  - job_name: node
    dns_sd_configs:
      - names: ['tasks.zabbix_metrics_node-exporter']
        type: A
        port: 9100
  - job_name: process
    dns_sd_configs:
      - names: ['tasks.zabbix_metrics_process-exporter']
        type: A
        port: 9256
  - job_name: cadvisor
    dns_sd_configs:
      - names: ['tasks.zabbix_metrics_cadvisor']
        type: A
        port: 8080
