name: Build and publish Patroni TimescaleDB image
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Install Ansible
        run: |
          python3 -m pip install 'ansible-core>=2.17,<2.20'
          ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
      - name: Build, test, and publish the image
        run: |
          set -a
          source .env.example
          set +a
          ansible-playbook -i localhost, ansible/publish-patroni-image.yml
