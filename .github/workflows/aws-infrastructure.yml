name: AWS infrastructure plan and apply
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed plan after the production environment gate
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: zabbix-ha-aws-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'
  TF_VAR_ami_id: ${{ vars.ZABBIX_AMI_ID }}
  TF_VAR_manager_instance_type: ${{ vars.ZABBIX_MANAGER_INSTANCE_TYPE }}
  TF_VAR_worker_instance_type: ${{ vars.ZABBIX_WORKER_INSTANCE_TYPE }}
  TF_VAR_volume_sizes_gb: ${{ vars.ZABBIX_VOLUME_SIZES_GB }}
  TF_VAR_allowed_web_cidrs: ${{ vars.ZABBIX_ALLOWED_WEB_CIDRS }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Check required deployment variables
        shell: bash
        run: |
          for name in TF_VAR_ami_id TF_VAR_manager_instance_type TF_VAR_worker_instance_type TF_VAR_volume_sizes_gb TF_VAR_allowed_web_cidrs; do
            if [[ -z "${!name}" ]]; then echo "Missing GitHub variable for $name" >&2; exit 1; fi
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl.example
      - run: terraform validate -no-color
      - run: terraform plan -input=false -no-color -out=tfplan
      - name: Store plan for the guarded apply
        if: ${{ inputs.apply }}
        uses: actions/upload-artifact@v4
        with:
          name: zabbix-terraform-plan
          path: terraform/aws/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    if: ${{ inputs.apply }}
    needs: plan
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/download-artifact@v4
        with:
          name: zabbix-terraform-plan
          path: terraform/aws
      - name: Check Elastic IP quota before creating resources
        shell: bash
        run: |
          quota=$(aws service-quotas get-service-quota --service-code ec2 --quota-code L-0263D0A3 --region us-east-1 --query 'Quota.Value' --output text)
          allocated=$(aws ec2 describe-addresses --region us-east-1 --query 'length(Addresses)' --output text)
          project_allocated=$(aws ec2 describe-addresses --region us-east-1 --filters Name=tag:Project,Values=zabbix-ha --query 'length(Addresses)' --output text)
          python3 -c 'import sys; q, used, ours = map(float, sys.argv[1:]); need = 4; print(f"Elastic IP quota={q:g}, allocated={used:g}, project={ours:g}, required={need}"); sys.exit(0 if q >= used - ours + need else 1)' "$quota" "$allocated" "$project_allocated"
      - run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl.example
      - run: terraform apply -input=false -no-color tfplan
