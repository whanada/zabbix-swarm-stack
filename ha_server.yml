version: "3.8"

x-server-environment: &server-environment
  TZ: "${TZ:-America/Sao_Paulo}"
  DB_SERVER_HOST: pgbouncer
  DB_SERVER_PORT: "5432"
  POSTGRES_USER_FILE: /run/secrets/zabbix_db_user
  POSTGRES_PASSWORD_FILE: /run/secrets/zabbix_db_password
  POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
  POSTGRES_USE_IMPLICIT_SEARCH_PATH: "true"
  ZBX_WEBSERVICEURL: "${ZBX_WEBSERVICEURL:-http://webservice:10053/report}"
  ZBX_WEBDRIVERURL: "${ZBX_WEBDRIVERURL:-http://selenium:4444}"
  ZBX_STARTREPORTWRITERS: "${ZBX_STARTREPORTWRITERS:-3}"
  ZBX_CACHESIZE: "${ZBX_CACHESIZE:-8G}"
  ZBX_HISTORYCACHESIZE: "${ZBX_HISTORYCACHESIZE:-2G}"
  ZBX_STARTPOLLERS: "${ZBX_STARTPOLLERS:-500}"
  ZBX_STARTIPMIPOLLERS: "${ZBX_STARTIPMIPOLLERS:-5}"
  ZBX_STARTPREPROCESSORS: "${ZBX_STARTPREPROCESSORS:-300}"
  ZBX_STARTPOLLERSUNREACHABLE: "${ZBX_STARTPOLLERSUNREACHABLE:-200}"
  ZBX_STARTHISTORYPOLLERS: "${ZBX_STARTHISTORYPOLLERS:-500}"
  ZBX_STARTTRAPPERS: "${ZBX_STARTTRAPPERS:-15}"
  ZBX_STARTHTTPPOLLERS: "${ZBX_STARTHTTPPOLLERS:-100}"
  ZBX_STARTESCALATORS: "${ZBX_STARTESCALATORS:-5}"
  ZBX_STARTVMWARECOLLECTORS: "${ZBX_STARTVMWARECOLLECTORS:-150}"
  ZBX_VMWAREFREQUENCY: "${ZBX_VMWAREFREQUENCY:-60}"
  ZBX_VMWAREPERFFREQUENCY: "${ZBX_VMWAREPERFFREQUENCY:-60}"
  ZBX_VMWARECACHESIZE: "${ZBX_VMWARECACHESIZE:-2G}"
  ZBX_VMWARETIMEOUT: "${ZBX_VMWARETIMEOUT:-60}"
  ZBX_STARTDBSYNCERS: "${ZBX_STARTDBSYNCERS:-50}"
  ZBX_HISTORYINDEXCACHESIZE: "${ZBX_HISTORYINDEXCACHESIZE:-2G}"
  ZBX_HISTORYSTORAGEDATEINDEX: "${ZBX_HISTORYSTORAGEDATEINDEX:-0}"
  ZBX_TRENDCACHESIZE: "${ZBX_TRENDCACHESIZE:-2G}"
  ZBX_VALUECACHESIZE: "${ZBX_VALUECACHESIZE:-2G}"
  ZBX_STARTLLDPROCESSORS: "${ZBX_STARTLLDPROCESSORS:-20}"
  ZBX_STARTPINGERS: "${ZBX_STARTPINGERS:-200}"
  ZBX_TIMEOUT: "${ZBX_TIMEOUT:-20}"
  ZBX_STARTPROXYPOLLERS: "${ZBX_STARTPROXYPOLLERS:-5}"
  ZBX_LISTENPORT: "10051"
  ZBX_DEBUGLEVEL: "${ZBX_DEBUGLEVEL:-2}"
  ZBX_HOUSEKEEPINGFREQUENCY: "${ZBX_HOUSEKEEPINGFREQUENCY:-0}"
  ZBX_MAXHOUSEKEEPERDELETE: "${ZBX_MAXHOUSEKEEPERDELETE:-2000}"
  ZBX_ENABLE_SNMP_TRAPS: "${ZBX_ENABLE_SNMP_TRAPS:-true}"
  ZBX_STARTALERTERS: "${ZBX_STARTALERTERS:-5}"
  ZBX_STARTDISCOVERERS: "${ZBX_STARTDISCOVERERS:-20}"
  ZBX_STARTBROWSERPOLLERS: "${ZBX_STARTBROWSERPOLLERS:-5}"
  ZBX_STARTSNMPPOLLERS: "${ZBX_STARTSNMPPOLLERS:-10}"
  ZBX_STARTODBCPOLLERS: "${ZBX_STARTODBCPOLLERS:-5}"
  ZBX_TLSCAFILE: /run/secrets/zabbix_ca
  ZBX_TLSCERTFILE: /run/secrets/zabbix_server_cert
  ZBX_TLSKEYFILE: /run/secrets/zabbix_server_key
  ZBX_TLSACCEPT: "${ZBX_TLSACCEPT:-cert}"

x-server-secrets: &server-secrets
  - source: zabbix_db_user
    target: zabbix_db_user
  - source: zabbix_db_password
    target: zabbix_db_password
  - source: zabbix_ca
    target: zabbix_ca
  - source: zabbix_server_cert
    target: zabbix_server_cert
  - source: zabbix_server_key
    target: zabbix_server_key

x-server-volumes: &server-volumes
  - type: bind
    source: "${ZABBIX_SNMP_TRAPS_PATH:?ZABBIX_SNMP_TRAPS_PATH is required}"
    target: /var/lib/zabbix/snmptraps
  - type: bind
    source: "${ZABBIX_MIBS_PATH:?ZABBIX_MIBS_PATH is required}"
    target: /var/lib/zabbix/mibs
    read_only: true

x-server-resources: &server-resources
  limits:
    cpus: "${ZABBIX_SERVER_CPU_LIMIT:-24}"
    memory: "${ZABBIX_SERVER_MEMORY_LIMIT:-28G}"
  reservations:
    cpus: "${ZABBIX_SERVER_CPU_RESERVATION:-4}"
    memory: "${ZABBIX_SERVER_MEMORY_RESERVATION:-8G}"

x-server-restart: &server-restart
  condition: on-failure
  delay: 10s
  window: 2m

x-server-update: &server-update
  parallelism: 1
  order: stop-first
  failure_action: rollback
  monitor: 60s

services:
  server-ha1:
    image: "${ZABBIX_SERVER_IMAGE:?ZABBIX_SERVER_IMAGE is required}"
    hostname: "${ZABBIX_HA1_HOSTNAME:?ZABBIX_HA1_HOSTNAME is required}"
    cap_add:
      - NET_RAW
    environment:
      <<: *server-environment
      ZBX_HANODENAME: "${ZABBIX_HA1_HOSTNAME}"
      ZBX_NODEADDRESS: "${ZABBIX_HA1_NODEADDRESS:-server-ha1:10051}"
    secrets: *server-secrets
    volumes: *server-volumes
    networks:
      zabbix:
        aliases:
          - server-ha1
    ports:
      - target: 10051
        published: ${ZABBIX_HA1_PUBLISHED_PORT:-10051}
        protocol: tcp
        mode: ingress
    stop_grace_period: 2m
    deploy:
      replicas: ${ZABBIX_HA1_REPLICAS:-1}
      placement:
        constraints:
          - "node.platform.os == linux"
          - "node.labels.zabbix_server == ${ZABBIX_HA1_NODE_LABEL:-ha1}"
      resources: *server-resources
      restart_policy: *server-restart
      update_config: *server-update
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  server-ha2:
    image: "${ZABBIX_SERVER_IMAGE:?ZABBIX_SERVER_IMAGE is required}"
    hostname: "${ZABBIX_HA2_HOSTNAME:?ZABBIX_HA2_HOSTNAME is required}"
    cap_add:
      - NET_RAW
    environment:
      <<: *server-environment
      ZBX_HANODENAME: "${ZABBIX_HA2_HOSTNAME}"
      ZBX_NODEADDRESS: "${ZABBIX_HA2_NODEADDRESS:-server-ha2:10051}"
    secrets: *server-secrets
    volumes: *server-volumes
    networks:
      zabbix:
        aliases:
          - server-ha2
    ports:
      - target: 10051
        published: ${ZABBIX_HA2_PUBLISHED_PORT:-10251}
        protocol: tcp
        mode: ingress
    stop_grace_period: 2m
    deploy:
      replicas: ${ZABBIX_HA2_REPLICAS:-1}
      placement:
        constraints:
          - "node.platform.os == linux"
          - "node.labels.zabbix_server == ${ZABBIX_HA2_NODE_LABEL:-ha2}"
      resources: *server-resources
      restart_policy: *server-restart
      update_config: *server-update
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  zabbix:
    external: true
    name: "${ZABBIX_NETWORK:?ZABBIX_NETWORK is required}"

secrets:
  zabbix_db_user:
    external: true
    name: "${ZABBIX_DB_USER_SECRET:?ZABBIX_DB_USER_SECRET is required}"
  zabbix_db_password:
    external: true
    name: "${ZABBIX_DB_PASSWORD_SECRET:?ZABBIX_DB_PASSWORD_SECRET is required}"
  zabbix_ca:
    external: true
    name: "${ZABBIX_CA_SECRET:?ZABBIX_CA_SECRET is required}"
  zabbix_server_cert:
    external: true
    name: "${ZABBIX_SERVER_CERT_SECRET:?ZABBIX_SERVER_CERT_SECRET is required}"
  zabbix_server_key:
    external: true
    name: "${ZABBIX_SERVER_KEY_SECRET:?ZABBIX_SERVER_KEY_SECRET is required}"
